# code sync: sonic-buildimage -> sonic-buildimage-msft
pr: none
trigger: none

pool: sonic-ubuntu-1c
variables:
  - group: sonicbld
steps:
  - checkout: self
    clean: true
  - bash: |
      set -ex
      sudo apt update
      sudo apt install -y gh jq
      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      git config --global user.email "sonicbld@microsoft.com"
      git config --global user.name "Sonic Automation"
      git config --global pull.rebase false
      echo $TOKEN | gh auth login --with-token

      sudo rm -rf sonic-buildimage-msft
      git clone https://github.com/Azure/sonic-buildimage-msft
      pushd sonic-buildimage-msft
      git remote add head https://github.com/sonic-net/sonic-buildimage
      git fetch head
    env:
      TOKEN: $(GITHUB-TOKEN)
    displayName: Setup env
  - bash: |
      set -ex
      branches=$(cat azure-pipelines/codesync.json | jq -r keys[])
      pushd sonic-buildimage-msft
      [ -z "$branches" ] && exit 1
      failed_branches=()
      for branch in $branches; do
        if [[ ",${SKIP_BRANCHES//[[:space:]]/}," == *",$branch,"* ]]; then
          echo "======Skipping code sync for $branch======"
          continue
        fi
        branch_base=$branch
        branch_head=$branch
        remote=head
        if [[ $branch_head == "master" ]]; then
          branch_head=master
        fi
        if [[ $branch_head == "202412" ]]; then
          branch_head=202411
        fi
        if [[ $branch_head == "202503" ]]; then
          continue # stop code sync for 202503
          branch_head=202412
          remote=origin
        fi
        if [[ $branch_head == "202506" ]]; then
          branch_head=202505
        fi
        if [[ $branch_head == "202512" ]]; then
          branch_head=202511
        fi
        if [[ $branch_head == "202603" ]]; then
          branch_head=202511
        fi
        if [[ $branch_head == "kubesonic" ]]; then
          branch_head=master
        fi
        if [[ $branch_head == "202511_azd" ]]; then
          branch_head=202511
        fi
        if [[ $branch_head == "202606" ]]; then
          branch_head=202605
        fi
        if [[ $branch_head == "202601" ]]; then
          branch_head=202511
        fi
        if [[ $branch_head == "202607" ]]; then
          branch_head=202605
        fi
        if [[ $branch_head == "202608" ]]; then
          branch_head=202605
        fi
        rc=0
        git ls-remote --exit-code origin refs/heads/$branch_base || rc=$?
        if [[ $rc -ne 0 ]]; then
          [[ $rc -eq 2 ]] && continue
          exit $rc
        fi
        rc=0
        git ls-remote --exit-code $remote refs/heads/$branch_head || rc=$?
        if [[ $rc -ne 0 ]]; then
          [[ $rc -eq 2 ]] && continue
          exit $rc
        fi
        head_commit=$(git log -n 1 --format=%H $remote/$branch_head)
        git log --format=%H origin/$branch_base | grep $head_commit && continue
        subs=$(cat ../azure-pipelines/codesync.json | jq -r ".\"$branch\"")
        
        git branch -D $branch_base || true
        git clean -xdff && git reset HEAD --hard
        git checkout -b $branch_base --track origin/$branch_base
        rm -rf $subs
        git submodule deinit -f --all
        git reset HEAD --hard
        git status

        git status | grep "^nothing to commit, working tree clean" || { echo "git not clean, exist!"; exit 1; }
        if [[ ! -z "$subs" ]]; then
          submodules_ready=false
          submodule_rc=0
          for i in {1..10}; do
            git submodule sync
            if git submodule update --init $subs; then
              submodules_ready=true
              break
            else
              submodule_rc=$?
            fi
            sleep 2
          done
          if [[ "$submodules_ready" != true ]]; then
            echo "##vso[task.logissue type=error]Failed to initialize submodules for $branch_base"
            exit $submodule_rc
          fi
        fi
        prehead=$(git log -n 1 --pretty=format:'%H')
        pull_rc=0
        git pull $remote $branch_head --no-commit || pull_rc=$?
        git status
        git submodule

        if ! git status | grep "^nothing to commit, working tree clean";then
          # code conflict
          [[ -z "$subs" ]] || git add $subs
          git reset platform/checkout/cisco-8000.ini
          git checkout platform/checkout/cisco-8000.ini
        fi

        unmerged_paths=$(git diff --name-only --diff-filter=U)
        if [[ -n "$unmerged_paths" ]]; then
          echo "##vso[task.logissue type=warning]Code sync conflict: $remote/$branch_head ($head_commit) -> origin/$branch_base ($prehead)"
          echo "======Unmerged paths for $branch_base======"
          echo "$unmerged_paths"
          git merge --abort
          failed_branches+=("$branch_base")
          continue
        fi

        if [[ $pull_rc -ne 0 ]] && ! git rev-parse --verify -q MERGE_HEAD > /dev/null; then
          echo "##vso[task.logissue type=error]git pull failed without merge conflicts: $remote/$branch_head -> origin/$branch_base"
          exit $pull_rc
        fi

        if git rev-parse --verify -q MERGE_HEAD > /dev/null; then
          GIT_EDITOR=true git merge --continue
        fi

        head=$(git log -n 1 --pretty=format:'%H')
        if [[ $prehead == $head ]];then
          echo "======No change after merging...======"
          continue
        fi
        echo "======Diff logs======"
        git log $prehead..HEAD --graph --pretty=format:'%h -%d %s (%cs) [%aN]'
        body=$(git log $prehead..HEAD --graph --pretty=format:'%h -%d %s (%cs) [%aN]')
        body='```<br>'$body'<br>```'
        # push code
        git push https://mssonicbld:$TOKEN@github.com/mssonicbld/sonic-buildimage-msft HEAD:sonicbld/$branch_base-merge -f
        # create PR
        rc=0
        url_=$(gh pr create -R Azure/sonic-buildimage-msft -H mssonicbld:sonicbld/$branch_base-merge -B $branch_base -t "[code sync] Merge code from sonic-net/sonic-buildimage:$branch_head to $branch_base" -b "$body" -l automerge 2>&1) || rc=$?
        if [[ $rc -ne 0 ]] && ! echo "$url_" | grep -q "already exists"; then
          echo "##vso[task.logissue type=error]Failed to create the code sync PR for $branch_base"
          echo "$url_"
          exit $rc
        fi
        url=$(echo "$url_" | grep -Eo https://github.com/Azure/sonic-buildimage-msft/pull/[0-9]* || true)
        if [[ -z "$url" ]]; then
          echo "##vso[task.logissue type=error]Failed to create or find the code sync PR for $branch_base"
          echo "$url_"
          exit 1
        fi

        sleep 10
      done
      if [[ ${#failed_branches[@]} -ne 0 ]]; then
        echo "##vso[task.logissue type=warning]Code sync conflicts detected for branches: ${failed_branches[*]}"
        echo "##vso[task.complete result=SucceededWithIssues;]Code sync completed with merge conflicts"
      fi
    env:
      TOKEN: $(GITHUB-TOKEN)
    displayName: 'code merge'
