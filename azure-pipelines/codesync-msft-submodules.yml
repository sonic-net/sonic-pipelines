# code sync for submodules: sonic-net/* -> Azure/sonic-*.msft
pr: none
trigger: none

pool: sonic-ubuntu-1c
variables:
  - group: sonicbld
steps:
  - checkout: self
    clean: true
  - bash: |
      set -ex
      sudo apt update
      sudo apt install -y gh jq
      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      git config --global user.email "sonicbld@microsoft.com"
      git config --global user.name "Sonic Automation"
      git config --global pull.rebase false
      echo $TOKEN | gh auth login --with-token

      repos=$(for i in $(cat azure-pipelines/codesync.json | jq .[] -r); do echo $i | sed 's#src/##'; done | sort -u)
      [ -z $repos ] && exit 1
      for repo in $repos; do
        sudo rm -rf $repo
        git clone https://github.com/sonic-net/$repo
        cd $repo
        git remote add base https://github.com/Azure/$repo.msft
        git remote update
        cd ..
        sleep 2
      done
    env:
      TOKEN: $(GITHUB-TOKEN)
    displayName: Setup env
  - bash: |
      set -ex
      # 202506 only code sync these 4 repos.
      branches_202506="sonic-utilities sonic-host-services sonic-platform-common sonic-platform-daemons sonic-gnmi"
      repos=$(for i in $(cat azure-pipelines/codesync.json | jq .[] -r); do echo $i | sed 's#src/##'; done | sort -u)
      cur_dir=$(pwd)
      sudo rm -rf $cur_dir/log
      sudo rm -rf $cur_dir/conflicts.jsonl
      for repo in $repos; do
        [ -d $cur_dir/$repo ] || continue
        cd $cur_dir/$repo
        echo "# $repo" | tee -a $cur_dir/log
        branches=$(cat ../azure-pipelines/codesync.json | jq -r keys[])
        for branch in $branches; do
          branch_repos=$(cat ../azure-pipelines/codesync.json | jq -r ".\"$branch\"")
          [ -z "$branch_repos" ] && continue
          if echo "$branch_repos" | grep -v $repo; then
            continue
          fi
          branch_base=$branch
          branch_head=$branch
          origin=origin
          if [[ $branch == "202412" ]]; then
            branch_head=202411
          fi
          if [[ $branch == "kubesonic" ]]; then
            branch_head=master
          fi
          if [[ $branch == "202503" ]]; then
            continue # Stop code sync from 202412 to 202503
          fi
          if [[ $branch == "202506" ]]; then
            echo $branches_202506 | grep $repo || continue
            branch_head=202505
          fi
          if [[ $branch == "202603" ]]; then
            branch_head=202511
          fi
          if [[ $branch == "202511_azd" ]]; then
            branch_head=202511
          fi
          if [[ $branch == "202512" ]]; then
            branch_head=202511
          fi
          if [[ $branch == "202606" ]]; then
            branch_head=202605
          fi
          if [[ $branch == "202601" ]]; then
            branch_head=202511
          fi
          if [[ $branch == "202607" ]]; then
            branch_head=202605
          fi
          if [[ $branch == "202608" ]]; then
            branch_head=202605
          fi
          echo "- $branch" | tee -a $cur_dir/log
          rc=0
          git ls-remote --exit-code $origin refs/heads/$branch_head || rc=$?
          if [[ $rc -ne 0 ]]; then
            if [[ $rc -eq 2 ]]; then
              echo "  - no branch: $origin" | tee -a $cur_dir/log
              continue
            fi
            exit $rc
          fi
          rc=0
          git ls-remote --exit-code base refs/heads/$branch_base || rc=$?
          if [[ $rc -ne 0 ]]; then
            if [[ $rc -eq 2 ]]; then
              echo "  - no branch: base" | tee -a $cur_dir/log
              continue
            fi
            exit $rc
          fi
          head_commit=$(git log -n 1 --format=%H $origin/$branch_head)
          git log --format=%H base/$branch_base | grep $head_commit && continue
          git merge --abort || true
          git branch -D test || true
          git checkout -b test
          git branch -D $branch_base || true
          git checkout -b $branch_base --track base/$branch_base
          git reset HEAD --hard
          git clean -xdff
          git status | grep "^nothing to commit, working tree clean" || { echo "  - git not clean" | tee -a $cur_dir/log; continue; }
          prehead=$(git log -n 1 --pretty=format:'%H')
          pull_rc=0
          git pull $origin $branch_head --no-edit || pull_rc=$?
          git status
          unmerged_paths=$(git diff --name-only --diff-filter=U)
          if [[ -n "$unmerged_paths" ]]; then
            echo "  - conflict!" | tee -a $cur_dir/log
            echo "$unmerged_paths"
            description="Repository: Azure/$repo.msft"
            jq -cn \
              --arg branch "$branch_base" \
              --arg commit "$head_commit" \
              --arg description "$description" \
              '{branch: $branch, commit: $commit, description: $description}' >> $cur_dir/conflicts.jsonl
            git merge --abort
            continue
          fi
          continue
          if [[ $pull_rc -ne 0 ]]; then
            exit $pull_rc
          fi
          head=$(git log -n 1 --pretty=format:'%H')
          if [[ $prehead == $head ]];then
            echo "  - No change after merging" | tee -a $cur_dir/log
            continue
          fi
          echo "  - Diff logs" | tee -a $cur_dir/log
          git log $prehead..HEAD --graph --pretty=format:'%h -%d %s (%cs) [%aN]' | sed 's/^/        /'
          body=$(git log $prehead..HEAD --graph --pretty=format:'%h -%d %s (%cs) [%aN]')
          body='```<br>'$body'<br>```'
          # push code
          git push https://mssonicbld:$TOKEN@github.com/mssonicbld/$repo.msft HEAD:sonicbld/$branch-merge -f
          # craete PR
          rc=0
          url_=$(gh pr create -R Azure/$repo.msft -H mssonicbld:sonicbld/$branch-merge -B $branch_base -t "[code sync] Merge code from sonic-net/$repo:$branch_head to $branch" -b "$body" -l automerge 2>&1) || rc=$?
          if [[ $rc -ne 0 ]] && ! echo "$url_" | grep -q "already exists"; then
            echo "$url_"
            exit $rc
          fi
          url=$(echo "$url_" | grep -Eo https://github.com/Azure/$repo.msft/pull/[0-9]* || true)
          if [[ -z "$url" ]]; then
            echo "$url_"
            exit 1
          fi
          if echo "$url_" | grep -q "already exists:"; then
            gh pr edit $url -b "$body" --add-label automerge
          fi
          echo "  - $url" >> $cur_dir/log
          sleep 10
        done
      done
    env:
      TOKEN: $(GITHUB-TOKEN)
    displayName: 'code sync'
  - bash: |
      set -ex
      cat log
      if grep -q '  - conflict!' log; then
        set +x
        printf '%s' "$CERT" | base64 -d > cert.pfx
        cert=$(openssl pkcs12 -in cert.pfx -nokeys -nodes -passin pass: | openssl x509 -noout -fingerprint -sha1 | sed 's/^.*=//' | tr -d ':' | tr 'A-Z' 'a-z')
        rm -f cert.pfx
        while IFS= read -r conflict; do
          payload=$(echo "$conflict" | jq \
            --arg name "code_conflict" \
            --arg client "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)" \
            '. + {name: $name, client: $client}')
          response=$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -H "thumbprint: $cert" \
            -X POST https://notice-center.azurewebsites.net/noti_center/notice \
            -d "$payload")
          echo "$response" | jq -e '.success == true'
        done < conflicts.jsonl
        set -x
        echo "##vso[task.logissue type=warning]Submodule code sync conflicts detected"
        echo "##vso[task.complete result=SucceededWithIssues;]Submodule code sync completed with merge conflicts"
      fi
      exit 0
    env:
      CERT: $(cert-noti)
    displayName: show result and send alert
